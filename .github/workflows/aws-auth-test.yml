name: AWS Deployment Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-deployment-test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::135458291619:role/GitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify CloudFormation deployment role
        run: |
          aws iam get-role \
            --role-name CloudFormationDeploymentRole

      - name: Verify PassRole permission
        run: |
          echo "GitHubActionsDeployRole can access the CloudFormation role"