name: Deploy Prod

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_DEPLOY_ROLE: arn:aws:iam::135458291619:role/GitHubActionsDeployRole

jobs:
  deploy-prod:
    name: Build and Deploy Prod
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-DeployProd

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Run Maven tests
        run: mvn test

      - name: SAM validate
        run: sam validate

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --config-env prod \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --role-arn arn:aws:iam::135458291619:role/CloudFormationDeploymentRole